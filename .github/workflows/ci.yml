# CI/CD de la web (Especificación F-13): lint, pruebas, build, E2E contra mocks y, en main, imagen en GHCR.
name: CI web

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read
  packages: write

env:
  VERSION: 1.0.0

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build
      - name: E2E (Playwright contra mocks, 390 y 1366 px)
        run: |
          npx playwright install --with-deps chromium
          mkdir -p evidencias
          E2E_EVIDENCIAS=evidencias npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright
          path: |
            playwright-report/
            evidencias/
          if-no-files-found: ignore

  imagen:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: verificar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/fiadoya-web:${{ env.VERSION }}
            ghcr.io/${{ github.repository_owner }}/fiadoya-web:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/fiadoya-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

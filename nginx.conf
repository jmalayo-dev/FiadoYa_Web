# FiadoYa web: SPA + proxy al gateway. El navegador solo habla con Nginx (mismo origen, sin CORS).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Estáticos con hash: caché larga. index.html y config.js: sin caché.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
  location = /config.js {
    add_header Cache-Control "no-store";
  }
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }

  location /api/ {
    proxy_pass http://${GATEWAY_HOST}:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 2m;
  }

  # Alertas en tiempo real (SSE): sin buffer y con lectura larga (Anexo §8.3).
  location = /api/alertas/stream {
    proxy_pass http://${GATEWAY_HOST}:8080;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    add_header X-Accel-Buffering no;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
